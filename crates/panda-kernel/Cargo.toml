[package]
name = "panda-kernel"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
panda-netlist.workspace = true
panda-timing.workspace = true
panda-compile.workspace = true
panda-fast.workspace = true
panda-sta.workspace = true
panda-jit = { workspace = true, optional = true }
serde_json.workspace = true

[features]
default = ["jit"]
# Tier 2 of Fast mode: the Cranelift JIT (`FastBackend::Jit`; without the feature it runs as
# `FastBackend::Compiled`).
jit = ["dep:panda-jit"]

[dev-dependencies]
panda-circuits.workspace = true
panda-cpu8.workspace = true
panda-difftest.workspace = true
